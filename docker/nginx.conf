events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /var/www;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Main page
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Logs endpoint
        location /logs {
            alias /var/www/logs;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            
            # Security: only allow viewing log files
            location ~* \.(log|txt)$ {
                add_header Content-Type text/plain;
            }
            
            # Block access to other file types
            location ~* \.(py|db|sqlite|yaml|yml|json)$ {
                deny all;
            }
        }

        # Data endpoint (read-only)
        location /data {
            alias /var/www/data;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            
            # Security: only allow viewing safe files
            location ~* \.(db|sqlite)$ {
                deny all;
            }
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API endpoints (if we add them later)
        location /api/ {
            # Proxy to Python service if needed
            # proxy_pass http://grab-subtitle:8080;
            return 404;
        }

        # Static files
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
} 