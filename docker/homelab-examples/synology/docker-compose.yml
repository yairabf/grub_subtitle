version: '3.8'

services:
  grab-subtitle:
    build: ../..
    container_name: grab-subtitle-synology
    restart: unless-stopped
    environment:
      # OpenSubtitles API credentials
      - OPENSUBTITLES_USERNAME=${OPENSUBTITLES_USERNAME}
      - OPENSUBTITLES_PASSWORD=${OPENSUBTITLES_PASSWORD}
      
      # OpenAI API key
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      # Target language (default: Hebrew)
      - TARGET_LANGUAGE=${TARGET_LANGUAGE:-he}
      
      # Directory to monitor (Synology volume path)
      - DIRECTORY_PATH=/media/videos
      
      # Logging
      - PYTHONUNBUFFERED=1
      
    volumes:
      # Mount Synology video directory
      - /volume1/video:/media/videos:ro
      
      # Mount subtitle output directory
      - /volume1/subtitles:/app/subtitles
      
      # Mount configuration directory
      - /volume1/docker/grab-subtitle/config:/app/config:ro
      
      # Mount data directory for database
      - /volume1/docker/grab-subtitle/data:/app/data
      
      # Mount logs directory
      - /volume1/docker/grab-subtitle/logs:/app/logs
      
      # Mount cache directory
      - /volume1/docker/grab-subtitle/cache:/app/cache
      
    networks:
      - subtitle-network
      
    # Resource limits for Synology NAS
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/data/service_database.db') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Add a simple web interface for monitoring
  subtitle-monitor:
    image: nginx:alpine
    container_name: subtitle-monitor-synology
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../../nginx.conf:/etc/nginx/nginx.conf:ro
      - /volume1/docker/grab-subtitle/logs:/var/www/logs:ro
      - /volume1/docker/grab-subtitle/data:/var/www/data:ro
      - ../../index.html:/var/www/index.html:ro
    depends_on:
      - grab-subtitle
    networks:
      - subtitle-network
    profiles:
      - monitor

networks:
  subtitle-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 