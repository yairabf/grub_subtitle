version: '3.8'

services:
  grab-subtitle:
    build: .
    container_name: grab-subtitle
    restart: unless-stopped
    environment:
      # OpenSubtitles API credentials
      - OPENSUBTITLES_USERNAME=${OPENSUBTITLES_USERNAME}
      - OPENSUBTITLES_PASSWORD=${OPENSUBTITLES_PASSWORD}
      
      # OpenAI API key
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      # Target language (default: Hebrew)
      - TARGET_LANGUAGE=${TARGET_LANGUAGE:-he}
      
      # Directory to monitor (default: /media/videos)
      - DIRECTORY_PATH=${DIRECTORY_PATH:-/media/videos}
      
      # Logging
      - PYTHONUNBUFFERED=1
      
    volumes:
      # Mount video directory to monitor
      - ${VIDEO_DIRECTORY:-./videos}:/media/videos:ro
      
      # Mount subtitle output directory
      - ${SUBTITLE_OUTPUT:-./subtitles}:/app/subtitles
      
      # Mount configuration directory
      - ${CONFIG_DIR:-./config}:/app/config:ro
      
      # Mount data directory for database
      - ${DATA_DIR:-./data}:/app/data
      
      # Mount logs directory
      - ${LOGS_DIR:-./logs}:/app/logs
      
      # Mount cache directory
      - ${CACHE_DIR:-./cache}:/app/cache
      
    networks:
      - subtitle-network
      
    # Resource limits for HomeLab environments
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/data/service_database.db') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Add a simple web interface for monitoring
  subtitle-monitor:
    image: nginx:alpine
    container_name: subtitle-monitor
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LOGS_DIR:-./logs}:/var/www/logs:ro
      - ${DATA_DIR:-./data}:/var/www/data:ro
    depends_on:
      - grab-subtitle
    networks:
      - subtitle-network
    profiles:
      - monitor

networks:
  subtitle-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 