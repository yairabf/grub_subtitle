# Multi-Language Subtitle Service Configuration
# Simple configuration with sensible defaults

# Required API Keys (must be set in .env file)
api:
  opensubtitles:
    username: ${OPENSUBTITLES_USERNAME}
    password: ${OPENSUBTITLES_PASSWORD}
  
  openai:
    api_key: ${OPENAI_API_KEY}

# Translation Settings
translation:
  target_language: "he"  # Target language (e.g., "he" for Hebrew, "es" for Spanish, "fr" for French)
  source_language: "en"  # Source language (default: English)
  fallback_languages: ["en"]  # Languages to try if target language not found
  language_priority: ["he", "en"]  # Priority order for subtitle search

# Language-specific settings
languages:
  he:  # Hebrew
    name: "Hebrew"
    validation:
      min_content_ratio: 0.5
      character_set: "hebrew"
      direction: "rtl"
  es:  # Spanish
    name: "Spanish"
    validation:
      min_content_ratio: 0.5
      character_set: "latin"
      direction: "ltr"
  fr:  # French
    name: "French"
    validation:
      min_content_ratio: 0.5
      character_set: "latin"
      direction: "ltr"
  de:  # German
    name: "German"
    validation:
      min_content_ratio: 0.5
      character_set: "latin"
      direction: "ltr"
  it:  # Italian
    name: "Italian"
    validation:
      min_content_ratio: 0.5
      character_set: "latin"
      direction: "ltr"
  pt:  # Portuguese
    name: "Portuguese"
    validation:
      min_content_ratio: 0.5
      character_set: "latin"
      direction: "ltr"
  ru:  # Russian
    name: "Russian"
    validation:
      min_content_ratio: 0.5
      character_set: "cyrillic"
      direction: "ltr"
  ja:  # Japanese
    name: "Japanese"
    validation:
      min_content_ratio: 0.5
      character_set: "japanese"
      direction: "ltr"
  ko:  # Korean
    name: "Korean"
    validation:
      min_content_ratio: 0.5
      character_set: "korean"
      direction: "ltr"
  zh:  # Chinese
    name: "Chinese"
    validation:
      min_content_ratio: 0.5
      character_set: "chinese"
      direction: "ltr"
  ar:  # Arabic
    name: "Arabic"
    validation:
      min_content_ratio: 0.5
      character_set: "arabic"
      direction: "rtl"

# Service Configuration
service:
  directories:
    - path: "${DIRECTORY_PATH}"
      enabled: true
      recursive: true
      scan_interval_minutes: 30
      file_size_limit_mb: 10000
      exclude_patterns: ["*.tmp", "*.temp", "*.part", ".DS_Store", "Thumbs.db"]
      include_patterns: ["*.mp4", "*.mkv", "*.avi", "*.mov", "*.wmv", "*.flv", "*.webm"]

# Email notifications removed for simplicity
# Add back later if needed

# Processing settings (sensible defaults)
processing:
  chunk_size: 3000
  max_blocks_per_chunk: 10
  supported_video_formats: [".mp4", ".mkv", ".avi", ".mov", ".wmv", ".flv", ".webm"]
  max_concurrent_processes: 3
  temp_directory: "./temp"

# Validation settings (sensible defaults)
validation:
  auto_fix: true
  strict_mode: false
  max_timestamp_error: 0.1

# Logging settings (sensible defaults)
logging:
  level: "INFO"
  file: "logs/subtitle_service.log"
  max_size: "10MB"
  backup_count: 5
  format: "json"
  console_output: true

# Security settings (sensible defaults)
security:
  encrypt_api_keys: true
  key_rotation_days: 90
  secure_storage_path: "./secure"
  audit_logging: true

# UI settings (sensible defaults)
ui:
  theme: "default"
  language: "en"
  auto_save_config: true
  show_advanced_options: false

# Path settings (sensible defaults)
paths:
  default_output_dir: "./subtitles"
  log_directory: "./logs"
  config_directory: "./config"
  cache_directory: "./cache"
  data_directory: "./data"
  temp_directory: "./temp" 